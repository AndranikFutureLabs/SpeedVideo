name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-13
            platform: mac
            arch: x64
          - os: macos-14
            platform: mac-arm
            arch: arm64
          - os: ubuntu-22.04
            platform: linux
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron main/preload
        run: node build-electron.mjs

      - name: Build Vue frontend
        run: node node_modules/vite/bin/vite.js build

      # ── Windows ──
      - name: Build Windows NSIS
        if: matrix.platform == 'win'
        run: node node_modules/electron-builder/cli.js --win --x64 --publish never

      # ── macOS Intel ──
      - name: Build macOS (Intel)
        if: matrix.platform == 'mac'
        run: node node_modules/electron-builder/cli.js --mac --x64 --publish never

      # ── macOS ARM ──
      - name: Build macOS (ARM)
        if: matrix.platform == 'mac-arm'
        run: node node_modules/electron-builder/cli.js --mac --arm64 --publish never

      # ── Linux ──
      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libarchive-tools zsync
          node node_modules/electron-builder/cli.js --linux --x64 --publish never

      # ── Collect built files (cross-platform via bash) ──
      - name: Collect built files
        shell: bash
        run: |
          mkdir -p release-files
          find release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.yml' \) -exec cp {} release-files/ \; 2>/dev/null || true
          ls -la release-files/ || true

      # ── Upload to GitHub Release directly ──
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SpeedVideo ${{ github.ref_name }}
          body: |
            ## 🎬 SpeedVideo ${{ github.ref_name }}
            
            Приложение для настройки и сохранения скорости воспроизведения видео.
            
            ### Возможности:
            - Загрузка видео (MP4, AVI, MKV, MOV, WebM, FLV, WMV)
            - Настройка скорости 10%-300% слайдером, пресетами и скролом
            - Предпросмотр на лету
            - Сохранение видео с физически изменённой скоростью через FFmpeg
            
            ### Установка:
            - **Windows**: Запустите `.exe` установщик
            - **macOS Intel**: Откройте `.dmg` (Intel)
            - **macOS ARM**: Откройте `.dmg` (Apple Silicon)
            - **Linux**: Запустите `.AppImage` (`chmod +x && ./file.AppImage`)
            
            > ⚠️ Windows SmartScreen: "Подробнее" → "Выполнить в любом случае"
          files: |
            release-files/*
          draft: false
          prerelease: false
