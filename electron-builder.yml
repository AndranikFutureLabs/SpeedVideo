appId: ru.andranikfuturelabs.skorostvideo
productName: SpeedVideo
copyright: Copyright © 2026 AndranikFutureLabs
artifactName: ${productName}-${version}-${platform}-${arch}.${ext}
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
  - package.json
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  legalTrademarks: AndranikFutureLabs
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  uninstallDisplayName: SpeedVideo

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: resources/icon.png
  category: public.app-category.video
  hardenedRuntime: false
dmg:
  contents:
    - x: 130
      y: 120
      path: /Applications
    - x: 410
      y: 120
      path: SpeedVideo.app
      type: link

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: resources/icon.png
  category: AudioVideo
  maintainer: AndranikFutureLabs
  artifactName: ${productName}-${version}-${arch}.${ext}
